[package]
name = "planner"
default-run = "goal"
version = "0.1.3"
description = "Local-first planning app: long-term goals to focus blocks"
edition = "2021"
rust-version = "1.88"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "goal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
reqwest = { version = "0.13.3", features = ["json", "stream", "socks"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
notify-rust = "4.11.7"
thiserror = "2.0.20"
uuid = { version = "1.20.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
