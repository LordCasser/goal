[package]
name = "planner"
version = "0.1.0"
description = "Local-first planning app: long-term goals to focus blocks"
edition = "2021"
rust-version = "1.80"

[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
thiserror = "2.0.20"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
